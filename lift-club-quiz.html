const KEY='liftClubQuiz_v1';
let state = freshState();
function freshState(){return {screen:'home',active:['rapha','minette','xander'],scores:{rapha:0,minette:0,xander:0,morne:0},roundScores:{rapha:0,minette:0,xander:0,morne:0},round:0,qIndex:0,category:null,current:null,answers:{},revealed:false,used:[],history:[],chooser:null,tieRotation:0};}
const el=()=>document.getElementById('app');
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function hasSave(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.screen&&s.screen!=='home';}catch{return false}}
function load(){try{state=Object.assign(freshState(),JSON.parse(localStorage.getItem(KEY)));render();}catch{}}
function reset(){localStorage.removeItem(KEY);state=freshState();render();}
function player(id){return PLAYERS.find(p=>p.id===id)}
function activePlayers(){return state.active.map(player)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function topbar(extra=''){return `<div class="topbar"><div class="brand"><div class="logo">🚐</div><div><h1>Lift Club Quiz</h1><small>Questionable knowledge. Serious bragging rights.</small></div></div><div style="display:flex;gap:8px;align-items:center">${extra}<button class="btn ghost" onclick="showMenu()">☰</button></div></div>`}
function render(){document.body.scrollTop=0;document.documentElement.scrollTop=0;({home:renderHome,setup:renderSetup,categories:renderCategories,question:renderQuestion,round:renderRound,final:renderFinal}[state.screen]||renderHome)();}
function renderHome(){el().innerHTML=topbar()+`<section class="card hero"><div class="eyebrow">🚦 THE COMMUTE JUST GOT COMPETITIVE</div><h2>Four brains.<br>One car.<br>No Googling.</h2><p>Five questions per round. Everyone locks in an answer before the reveal. The round winner earns the right to pick the next category, while the full-session scoreboard keeps the arguments alive all the way home.</p><div class="hero-actions"><button class="btn primary big" onclick="goSetup()">Start new game</button>${hasSave()?`<button class="btn big" onclick="load()">Resume saved game</button>`:''}<button class="btn big" onclick="showHow()">How it works</button></div><div class="rules"><div class="rule"><b>5 questions</b><span>Every category round is short enough for traffic lights.</span></div><div class="rule"><b>Lock it in</b><span>Each active player picks A, B, C or D before reveal.</span></div><div class="rule"><b>Winner chooses</b><span>Best round score controls the next category.</span></div><div class="rule"><b>Session crown</b><span>Total points remain visible for the whole lift.</span></div></div></section>`}
function goSetup(){state=freshState();state.screen='setup';render()}
function renderSetup(){el().innerHTML=topbar()+`<section class="card setup"><h2 class="section-title">Who’s in the car?</h2><p class="section-sub">Tap players to include or bench them. You need at least two brave volunteers.</p><div class="player-grid">${PLAYERS.map(p=>`<div class="player-pick ${state.active.includes(p.id)?'active':''}" onclick="togglePlayer('${p.id}')"><div class="avatar">${p.emoji}</div><strong>${p.name}</strong><small>${state.active.includes(p.id)?'Playing today':'Sitting this one out'}</small></div>`).join('')}</div><div class="setup-footer"><span class="pill">💡 Answers stay hidden until everyone has chosen</span><button class="btn primary big" ${state.active.length<2?'disabled':''} onclick="startGame()">Choose first category →</button></div></section>`}
function togglePlayer(id){state.active=state.active.includes(id)?state.active.filter(x=>x!==id):[...state.active,id];renderSetup()}
function startGame(){if(state.active.length<2)return;state.round=1;state.chooser=state.active[0];state.screen='categories';save();render()}
function remaining(cat){return QUESTIONS.filter(q=>q.c===cat&&!state.used.includes(q.id)).length}
function renderCategories(){const cp=player(state.chooser)||activePlayers()[0];el().innerHTML=topbar(`<span class="pill">Round ${state.round}</span>`)+scoreStrip()+`<section class="card setup"><div class="eyebrow">CATEGORY CONTROL</div><h2 class="section-title" style="margin-top:8px">${cp.emoji} ${cp.name} chooses the next category</h2><p class="section-sub">Pick your poison. Each category has 10 curated questions; repeats are avoided for the session.</p><div class="category-grid">${Object.entries(CATEGORIES).map(([id,c])=>{let r=remaining(id);return `<button class="cat ${r<5?'exhausted':''}" ${r<5?'disabled':''} onclick="chooseCategory('${id}')"><span class="emoji">${c.emoji}</span><strong>${c.name}</strong><small>${c.desc}</small><span class="remaining">${r} unseen question${r===1?'':'s'} left</span></button>`}).join('')}</div></section>`}
function chooseCategory(cat){const pool=QUESTIONS.filter(q=>q.c===cat&&!state.used.includes(q.id));if(pool.length<5)return;state.category=cat;state.qIndex=0;state.roundScores={rapha:0,minette:0,xander:0,morne:0};state.current=null;state.answers={};state.revealed=false;state.screen='question';nextQuestion();}
function nextQuestion(){if(state.qIndex>=5){endRound();return}const pool=QUESTIONS.filter(q=>q.c===state.category&&!state.used.includes(q.id));const q=pool[Math.floor(Math.random()*pool.length)];state.current=q.id;state.used.push(q.id);state.answers={};state.revealed=false;save();render()}
function currentQ(){return QUESTIONS.find(q=>q.id===state.current)}
function scoreStrip(){const max=Math.max(...state.active.map(id=>state.scores[id]));return `<div class="score-strip">${activePlayers().map(p=>`<div class="score-card ${state.scores[p.id]===max&&max>0?'leading':''}"><div class="name">${p.emoji} ${p.name}</div><div class="nums"><span class="total">${state.scores[p.id]}</span><span class="round">total · ${state.roundScores[p.id]} this round</span></div></div>`).join('')}</div>`}
function renderQuestion(){const q=currentQ(),c=CATEGORIES[state.category];const allAnswered=state.active.every(id=>state.answers[id]!==undefined);el().innerHTML=topbar(`<span class="pill">Round ${state.round} · Q${state.qIndex+1}/5</span>`)+scoreStrip()+`<div class="game-layout"><section class="card question-card"><div class="q-head"><span class="category-chip">${c.emoji} ${c.name}</span><span class="q-count">Question ${state.qIndex+1} of 5</span></div><div class="question">${q.q}</div><div class="answers">${q.o.map((o,i)=>`<button class="answer ${state.revealed?(i===q.a?'correct':(Object.values(state.answers).includes(i)?'wrong':'dim')):''}" disabled><span class="letter">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div>${state.revealed?`<div class="reveal-box"><h4>✅ ${'ABCD'[q.a]}. ${q.o[q.a]}</h4><p>${q.f}</p></div>`:''}</section><aside class="card side"><h3>Lock in answers</h3><p class="hint">Host: ask everyone first, then tap their answers here. Answers can be changed until reveal.</p>${activePlayers().map(p=>playerAnswerUI(p,state.revealed)).join('')}<div class="side-actions">${!state.revealed?`<button class="btn primary" ${!allAnswered?'disabled':''} onclick="reveal()">Reveal answer</button>`:`<button class="btn good" onclick="advance()">${state.qIndex===4?'Finish round':'Next question'} →</button>`}<button class="btn" onclick="showScoreboard()">View scoreboard</button></div></aside></div>`}
function playerAnswerUI(p,locked){const val=state.answers[p.id];return `<div class="player-answer"><div class="pa-head"><strong>${p.emoji} ${p.name}</strong><span class="locked">${val!==undefined?'LOCKED '+('ABCD'[val]):'WAITING…'}</span></div><div class="choice-row">${[0,1,2,3].map(i=>`<button class="choice ${val===i?'selected':''}" ${locked?'disabled':''} onclick="answer('${p.id}',${i})">${'ABCD'[i]}</button>`).join('')}</div></div>`}
function answer(pid,i){if(state.revealed)return;state.answers[pid]=i;save();renderQuestion()}
function reveal(){if(!state.active.every(id=>state.answers[id]!==undefined))return;const q=currentQ();state.active.forEach(id=>{if(state.answers[id]===q.a){state.scores[id]++;state.roundScores[id]++;}});state.revealed=true;state.history.push({round:state.round,cat:state.category,q:q.q,correct:q.o[q.a],answers:{...state.answers}});save();renderQuestion()}
function advance(){if(!state.revealed)return;state.qIndex++;nextQuestion()}
function endRound(){const vals=state.active.map(id=>state.roundScores[id]);const best=Math.max(...vals);const winners=state.active.filter(id=>state.roundScores[id]===best);let chooser;if(winners.length===1){chooser=winners[0]}else{chooser=winners[state.tieRotation%winners.length];state.tieRotation++}state.chooser=chooser;state.screen='round';save();render()}
function renderRound(){const best=Math.max(...state.active.map(id=>state.roundScores[id]));const winners=state.active.filter(id=>state.roundScores[id]===best);const c=CATEGORIES[state.category];el().innerHTML=topbar(`<span class="pill">Round ${state.round} complete</span>`)+scoreStrip()+`<section class="card round-summary"><div class="eyebrow">ROUND COMPLETE · ${c.emoji} ${c.name}</div><h2 class="section-title" style="margin-top:8px">${winners.length===1?`${player(winners[0]).name} takes the round!`:`Tie at the top!`}</h2><p class="section-sub">${winners.length===1?`${player(winners[0]).name} gets category control.`:`Tied winners share the glory; ${player(state.chooser).name} gets this category pick.`}</p><div class="podium">${[...activePlayers()].sort((a,b)=>state.roundScores[b.id]-state.roundScores[a.id]).map(p=>`<div class="pod ${state.roundScores[p.id]===best?'winner':''}"><div class="medal">${state.roundScores[p.id]===best?'🏆':p.emoji}</div><strong>${p.name}</strong><div class="pts">${state.roundScores[p.id]}/5</div></div>`).join('')}</div><div class="statline"><span>Next category chooser</span><b>${player(state.chooser).emoji} ${player(state.chooser).name}</b></div><div class="statline"><span>Questions played this session</span><b>${state.history.length}</b></div><div class="footer-actions"><button class="btn" onclick="showScoreboard()">Full scoreboard</button><button class="btn primary big" onclick="newRound()">Next round →</button></div></section>`}
function newRound(){state.round++;state.screen='categories';state.category=null;state.current=null;state.answers={};state.revealed=false;state.roundScores={rapha:0,minette:0,xander:0,morne:0};save();render()}
function endSession(){state.screen='final';save();render()}
function renderFinal(){const best=Math.max(...state.active.map(id=>state.scores[id]));const winners=state.active.filter(id=>state.scores[id]===best);const sorted=[...activePlayers()].sort((a,b)=>state.scores[b.id]-state.scores[a.id]);el().innerHTML=topbar()+`<section class="card round-summary"><div class="eyebrow">🏁 LIFT COMPLETE</div><h2 class="section-title" style="margin-top:8px">${winners.length===1?`${player(winners[0]).emoji} ${player(winners[0]).name} is today’s Trivia Menace!`:`🏆 We have joint Trivia Menaces!`}</h2><p class="section-sub">${state.history.length} questions, ${state.round} round${state.round===1?'':'s'}, and probably at least one argument that will continue tomorrow.</p><div class="podium">${sorted.map((p,i)=>`<div class="pod ${state.scores[p.id]===best?'winner':''}"><div class="medal">${state.scores[p.id]===best?'👑':p.emoji}</div><strong>${p.name}</strong><div class="pts">${state.scores[p.id]} pts</div><small style="color:var(--muted)">${i===0?'Top of the car':'Final score'}</small></div>`).join('')}</div><div class="footer-actions"><button class="btn" onclick="showHistory()">Question history</button><button class="btn primary big" onclick="reset()">New game</button></div></section>`}
function showHow(){modal(`<h3>How to play</h3><p>One person acts as host and reads the question aloud. Each active player says or thinks their choice, then the host taps A/B/C/D for each player. Once everyone is locked in, reveal the correct answer.</p><p>Each correct answer is worth 1 point. A round has 5 questions. The highest scorer in the round chooses the next category. In a tie, category control rotates among the tied winners.</p><p>No Google. No changing your answer after someone says “final answer”. No appeals to the International Court of Trivia.</p>`)}
function showScoreboard(){const sorted=[...activePlayers()].sort((a,b)=>state.scores[b.id]-state.scores[a.id]);modal(`<h3>🏁 Session scoreboard</h3><p>${state.history.length} questions played across ${state.round}${state.screen==='round'?'':' current'} round${state.round===1?'':'s'}.</p><div>${sorted.map((p,i)=>`<div class="statline"><span>${i===0?'👑 ':''}${p.emoji} ${p.name}</span><b>${state.scores[p.id]} pts</b></div>`).join('')}</div>${state.history.length?`<div class="footer-actions"><button class="btn" onclick="closeModal();showHistory()">Question history</button></div>`:''}`)}
function showHistory(){modal(`<h3>🧾 Question history</h3><div class="history">${[...state.history].reverse().map(h=>`<div class="history-row"><div><b>${h.q}</b><br><small>${CATEGORIES[h.cat].emoji} ${CATEGORIES[h.cat].name} · Round ${h.round}</small></div><small>✅ ${h.correct}</small></div>`).join('')||'<p>No questions yet.</p>'}</div>`)}
function showMenu(){modal(`<h3>Game menu</h3><p>Your session autosaves on this device after every action.</p><div style="display:grid;gap:9px;margin-top:18px"><button class="btn" onclick="closeModal();showScoreboard()">🏁 Scoreboard</button><button class="btn" onclick="closeModal();showHistory()">🧾 Question history</button><button class="btn" onclick="toggleFullscreen()">⛶ Full screen</button>${state.history.length?`<button class="btn good" onclick="closeModal();endSession()">🏁 End session</button>`:''}<button class="btn danger" onclick="confirmReset()">Start over</button></div>`)}
function confirmReset(){modal(`<h3>Start a new game?</h3><p>This clears the current score, question history and used-question list on this device.</p><div class="footer-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="closeModal();reset()">Yes, reset it</button></div>`)}
function modal(content){document.body.insertAdjacentHTML('beforeend',`<div class="modal-wrap" id="modal" onclick="if(event.target===this)closeModal()"><div class="card modal">${content}<div class="footer-actions"><button class="btn" onclick="closeModal()">Close</button></div></div></div>`)}
function closeModal(){document.getElementById('modal')?.remove()}
function toggleFullscreen(){closeModal();if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
render();

  </script>
</body>
</html>
