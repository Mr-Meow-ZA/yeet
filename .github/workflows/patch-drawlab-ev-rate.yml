name: Patch DrawLab EV Cache Pacing

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-drawlab-ev-rate.yml'
      - 'drawlab-sa/scripts/patch_ev_rate_once.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply paced cache patch
        run: python drawlab-sa/scripts/patch_ev_rate_once.py
      - name: Validate patch
        run: |
          python -m py_compile drawlab-sa/scripts/ev_hunter.py
          grep -q 'per_game_cap = 28' drawlab-sa/scripts/ev_hunter.py
          grep -q 'workers 1' .github/workflows/install-drawlab-ev-hunter.yml
      - name: Commit patch and clean probe machinery
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-drawlab-ev-rate.yml drawlab-sa/scripts/patch_ev_rate_once.py .github/workflows/probe-drawlab-ev-source.yml
          git config user.name 'DrawLab Research Bot'
          git config user.email 'drawlab-research@users.noreply.github.com'
          git add drawlab-sa/scripts/ev_hunter.py .github/workflows/install-drawlab-ev-hunter.yml .github/workflows/patch-drawlab-ev-rate.yml drawlab-sa/scripts/patch_ev_rate_once.py .github/workflows/probe-drawlab-ev-source.yml
          git commit -m 'Pace DrawLab EV economics cache safely'
          git push origin HEAD:master
