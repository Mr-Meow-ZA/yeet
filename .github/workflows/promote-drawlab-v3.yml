name: Promote DrawLab v3

on:
  push:
    paths:
      - '.github/workflows/promote-drawlab-v3.yml'

permissions:
  contents: write

concurrency:
  group: drawlab-site-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install production website bundle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/drawlab-v3.b64 <<'BUNDLE'

BUNDLE
          base64 -d /tmp/drawlab-v3.b64 > /tmp/drawlab-v3.tar.gz
          echo '02a063064dbae25464fdfc3d6918f810da0f7b2b21b4a74f5d22ec903b068e55  /tmp/drawlab-v3.tar.gz' | sha256sum -c -
          mkdir -p /tmp/drawlab-v3
          tar -xzf /tmp/drawlab-v3.tar.gz -C /tmp/drawlab-v3
          mkdir -p drawlab-sa/legacy
          if [ ! -s drawlab-sa/legacy/index.html ]; then cp drawlab-sa/index.html drawlab-sa/legacy/index.html; fi
          cp -f /tmp/drawlab-v3/drawlab-sa/v3/index.html drawlab-sa/v3/index.html
          cp -f /tmp/drawlab-v3/drawlab-sa/v3/styles.css drawlab-sa/v3/styles.css
          cp -f /tmp/drawlab-v3/drawlab-sa/v3/app.js drawlab-sa/v3/app.js
          cp -f /tmp/drawlab-v3/drawlab-sa/v3/icon.svg drawlab-sa/v3/icon.svg
          cp -f /tmp/drawlab-v3/drawlab-sa/manifest.webmanifest drawlab-sa/manifest.webmanifest
          cp -f /tmp/drawlab-v3/drawlab-sa/sw.js drawlab-sa/sw.js
          cp -f /tmp/drawlab-v3/drawlab-sa/index.html drawlab-sa/index.html
      - name: Validate production website
        shell: bash
        run: |
          set -euo pipefail
          test -s drawlab-sa/legacy/index.html
          test -s drawlab-sa/v3/app.js
          test -s drawlab-sa/v3/styles.css
          test -s drawlab-sa/manifest.webmanifest
          test -s drawlab-sa/sw.js
          ! grep -q '__PLACEHOLDER__' drawlab-sa/v3/styles.css
          grep -q 'Research the process' drawlab-sa/index.html
          grep -q '1 · 2 · 4 · 8 · 20 · Never' drawlab-sa/index.html
          grep -q 'drawlab-state' drawlab-sa/v3/app.js
          node --check drawlab-sa/v3/app.js
          python - <<'PY'
          import json
          json.load(open('drawlab-sa/manifest.webmanifest'))
          json.load(open('drawlab-sa/v3/data/v3-state.json'))
          print('DrawLab production shell validated')
          PY
      - name: Commit DrawLab v3 production site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DrawLab v3 Builder'
          git config user.email 'drawlab-v3@users.noreply.github.com'
          git add drawlab-sa/index.html drawlab-sa/legacy/index.html drawlab-sa/v3/index.html drawlab-sa/v3/styles.css drawlab-sa/v3/app.js drawlab-sa/v3/icon.svg drawlab-sa/manifest.webmanifest drawlab-sa/sw.js
          if git diff --cached --quiet; then echo 'No site changes'; exit 0; fi
          git commit -m 'Promote DrawLab v3 research platform'
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            git fetch origin master
            git rebase origin/master
          done
          exit 1
