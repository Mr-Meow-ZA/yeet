name: Promote DrawLab v3

on:
  push:
    paths:
      - '.github/workflows/promote-drawlab-v3.yml'
      - 'drawlab-sa/v3/.build/**'

permissions:
  contents: write

concurrency:
  group: drawlab-site-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Assemble exact v3 production assets
        shell: bash
        run: |
          set -euo pipefail
          cat drawlab-sa/v3/.build/app.1.txt drawlab-sa/v3/.build/app.2.txt drawlab-sa/v3/.build/app.3.txt > drawlab-sa/v3/app.js
          cat drawlab-sa/v3/.build/index.1.txt drawlab-sa/v3/.build/index.2.txt > drawlab-sa/v3/index.html
          cat drawlab-sa/v3/.build/style.1.txt drawlab-sa/v3/.build/style.2.txt drawlab-sa/v3/.build/style.3.txt > drawlab-sa/v3/styles.css
          echo 'd28c4ccffcfdbeb581cab8f6da03db4e0966dfe6539ab74a003dada50b161298  drawlab-sa/v3/app.js' | sha256sum -c -
          echo 'd665068c0a765dc2f8a52b804fba962ef19840d0332ccc3a3cea45a4c40335bb  drawlab-sa/v3/index.html' | sha256sum -c -
          echo '522578aceec02670c360771432fa57046501b830e356adede36363db7c105a15  drawlab-sa/v3/styles.css' | sha256sum -c -

      - name: Preserve v2 and build root production entry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p drawlab-sa/legacy
          if [ ! -s drawlab-sa/legacy/index.html ]; then
            cp drawlab-sa/index.html drawlab-sa/legacy/index.html
          fi
          python - <<'PY'
          from pathlib import Path
          src=Path('drawlab-sa/v3/index.html').read_text()
          src=src.replace('href="../manifest.webmanifest"','href="manifest.webmanifest"')
          src=src.replace('href="icon.svg"','href="v3/icon.svg"')
          src=src.replace('href="styles.css"','href="v3/styles.css"')
          src=src.replace('src="app.js"','src="v3/app.js"')
          Path('drawlab-sa/index.html').write_text(src)
          PY
          echo 'c1e9aa0adcb9d37a77c61a6fd3953ea2785d83407f1e72f766684eaf87ad5874  drawlab-sa/index.html' | sha256sum -c -

      - name: Validate production website
        shell: bash
        run: |
          set -euo pipefail
          test -s drawlab-sa/legacy/index.html
          test -s drawlab-sa/v3/app.js
          test -s drawlab-sa/v3/styles.css
          test -s drawlab-sa/manifest.webmanifest
          test -s drawlab-sa/sw.js
          test -s drawlab-sa/v3/icon.svg
          ! grep -q '__PLACEHOLDER__' drawlab-sa/v3/styles.css
          grep -q 'Research the process' drawlab-sa/index.html
          grep -q '1 · 2 · 4 · 8 · 20 · Never' drawlab-sa/index.html
          grep -q 'drawlab-state' drawlab-sa/v3/app.js
          grep -q 'Supabase primary' drawlab-sa/v3/app.js
          node --check drawlab-sa/v3/app.js
          python - <<'PY'
          import json
          json.load(open('drawlab-sa/manifest.webmanifest'))
          state=json.load(open('drawlab-sa/v3/data/v3-state.json'))
          assert state.get('schema_version',0) >= 4, state.get('schema_version')
          wf=state.get('research',{}).get('walk_forward',[])
          hs={str(r.get('horizon')) for r in wf}
          assert {'1','2','4','8','20','never'} <= hs, hs
          print('DrawLab production shell and research state validated')
          PY

      - name: Commit DrawLab v3 production site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DrawLab v3 Builder'
          git config user.email 'drawlab-v3@users.noreply.github.com'
          git add drawlab-sa/index.html drawlab-sa/legacy/index.html drawlab-sa/v3/index.html drawlab-sa/v3/styles.css drawlab-sa/v3/app.js drawlab-sa/v3/icon.svg drawlab-sa/manifest.webmanifest drawlab-sa/sw.js
          if git diff --cached --quiet; then
            echo 'No site changes'
            exit 0
          fi
          git commit -m 'Promote DrawLab v3 research platform'
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            git fetch origin master
            git rebase origin/master
          done
          exit 1
