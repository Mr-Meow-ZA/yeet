name: Patch DrawLab v3 database research

on:
  push:
    paths:
      - '.github/workflows/patch-drawlab-v3-db-research.yml'
      - 'drawlab-sa/scripts/patch_v3_db_research.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch database research read path
        run: python drawlab-sa/scripts/patch_v3_db_research.py
      - name: Bust PWA shell cache
        run: sed -i 's/drawlab-v3-shell-1/drawlab-v3-shell-2/g' drawlab-sa/sw.js
      - name: Validate production JS
        shell: bash
        run: |
          set -euo pipefail
          node --check drawlab-sa/v3/app.js
          grep -q 'const rs = db.research' drawlab-sa/v3/app.js
          grep -q 'drawlab-v3-shell-2' drawlab-sa/sw.js
      - name: Commit database-first research UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DrawLab v3 Builder'
          git config user.email 'drawlab-v3@users.noreply.github.com'
          git add drawlab-sa/v3/app.js drawlab-sa/sw.js
          git commit -m 'Use Supabase as primary DrawLab research read source'
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            git fetch origin master
            git rebase origin/master
          done
          exit 1
