name: Harden DrawLab Health

on:
  workflow_dispatch:
  push:
    paths:
      - 'drawlab-sa/scripts/harden_cloud_health.py'
      - '.github/workflows/harden-drawlab-health.yml'

permissions:
  contents: write

concurrency:
  group: drawlab-data-writes
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch health reporting
        run: python drawlab-sa/scripts/harden_cloud_health.py
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Validate engine
        run: python -m py_compile drawlab-sa/scripts/update_cloud.py
      - name: Refresh cloud state
        run: python drawlab-sa/scripts/update_cloud.py
      - name: Validate state
        run: python drawlab-sa/scripts/validate_state.py
      - name: Commit health fix
        run: |
          git config user.name 'DrawLab Research Migration'
          git config user.email 'drawlab-research@users.noreply.github.com'
          git add drawlab-sa/scripts/update_cloud.py drawlab-sa/data/cloud-state.json
          git diff --cached --quiet && exit 0
          git commit -m 'Separate DrawLab source warnings from health errors'
          git push origin HEAD:master
