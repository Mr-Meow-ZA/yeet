name: DrawLab Integrity

on:
  pull_request:
    paths:
      - 'drawlab-sa/**'
      - '.github/workflows/drawlab-*.yml'
  push:
    paths:
      - 'drawlab-sa/**'
      - '.github/workflows/drawlab-cloud.yml'
      - '.github/workflows/drawlab-research.yml'
      - '.github/workflows/drawlab-supabase-sync.yml'
      - '.github/workflows/import-drawlab-history.yml'
      - '.github/workflows/drawlab-integrity.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: read

concurrency:
  group: drawlab-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile permanent DrawLab engines
        shell: bash
        run: |
          python -m py_compile \
            drawlab-sa/scripts/update_cloud.py \
            drawlab-sa/scripts/import_history.py \
            drawlab-sa/scripts/research_engine.py \
            drawlab-sa/scripts/strategy_discovery.py \
            drawlab-sa/scripts/shadow_tracker.py \
            drawlab-sa/scripts/ev_hunter.py \
            drawlab-sa/scripts/ev_hunter_v2.py \
            drawlab-sa/scripts/crowd_model.py \
            drawlab-sa/scripts/draw_integrity.py \
            drawlab-sa/scripts/retrospective_v3.py \
            drawlab-sa/scripts/build_v3_state.py \
            drawlab-sa/scripts/validate_state.py
      - name: Validate stored results and tickets
        run: python drawlab-sa/scripts/validate_state.py
      - name: Validate research artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data=Path('drawlab-sa/data')
          v3=Path('drawlab-sa/v3/data')
          for p in [v3/'frozen-alpha.json',v3/'retrospective.json',v3/'v3-state.json',data/'research-state.json',data/'ev-state.json',data/'crowd-state.json',data/'integrity-state.json']:
              assert p.exists() and p.stat().st_size > 2, p
              json.loads(p.read_text())
          state=json.loads((v3/'v3-state.json').read_text())
          assert state.get('schema_version',0) >= 8, state.get('schema_version')
          assert state.get('cloud_status') == 'ok', state.get('cloud_status')
          frozen=json.loads((v3/'frozen-alpha.json').read_text())
          assert frozen.get('locked') is True and len(frozen.get('lines',{})) == 3
          retro=json.loads((v3/'retrospective.json').read_text())
          assert retro.get('simulation',{}).get('method') == 'strict walk-forward; no future leakage'
          research=json.loads((data/'research-state.json').read_text())
          assert research.get('methodology_version') == '3.0'
          horizons={str(r.get('horizon')) for r in research.get('walk_forward',[])}
          assert {'1','2','4','8','20','never'} <= horizons
          ev=json.loads((data/'ev-state.json').read_text())
          crowd=json.loads((data/'crowd-state.json').read_text())
          integrity=json.loads((data/'integrity-state.json').read_text())
          assert ev.get('model_version') == 'EV Hunter v2.0'
          assert ev.get('current',{}).get('Daily Lotto',{}).get('break_even_jackpot') is None
          assert crowd.get('model_version') == 'Crowd Model v1.0'
          assert integrity.get('model_version') == 'Draw Integrity Auditor v1.0'
          assert integrity.get('overall_status') in {'consistent_with_randomness','review_required'}
          assert state.get('ev_hunter',{}).get('model_version') == 'EV Hunter v2.0'
          assert state.get('crowd_model',{}).get('model_version') == 'Crowd Model v1.0'
          assert state.get('integrity_audit',{}).get('model_version') == 'Draw Integrity Auditor v1.0'
          print('Research artifacts healthy:',ev['model_version'],crowd['model_version'],integrity['overall_status'])
          PY
      - name: Validate production website
        shell: bash
        run: |
          set -euo pipefail
          node --check drawlab-sa/v3/app-v4.js
          test -s drawlab-sa/index.html
          test -s drawlab-sa/v3/styles-v4.css
          test -s drawlab-sa/v3/app-v4.js
          test -s drawlab-sa/manifest.webmanifest
          test -s drawlab-sa/sw.js
          grep -q 'id="dashboard"' drawlab-sa/index.html
          grep -q 'id="live"' drawlab-sa/index.html
          grep -q 'id="models"' drawlab-sa/index.html
          grep -q 'id="market"' drawlab-sa/index.html
          grep -q 'id="research"' drawlab-sa/index.html
          grep -q 'id="archive"' drawlab-sa/index.html
          grep -q 'v3/styles-v4.css' drawlab-sa/index.html
          grep -q 'v3/app-v4.js' drawlab-sa/index.html
          grep -q 'drawlab-state' drawlab-sa/v3/app-v4.js
          grep -q 'EV Hunter v2' drawlab-sa/index.html
          grep -q 'Crowd Model v1' drawlab-sa/index.html
          grep -q 'DRAW INTEGRITY' drawlab-sa/index.html
          grep -q 'drawlab-v4-shell-1' drawlab-sa/sw.js
      - name: Verify Supabase read model
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 30 'https://lnmgieielbqqqvboonzj.supabase.co/functions/v1/drawlab-state')"
          python - <<'PY' "$response"
          import json,sys
          p=json.loads(sys.argv[1])
          assert p.get('database_status') == 'ok'
          counts=p.get('counts') or {}
          assert counts.get('draws',0) >= 1488, counts
          research=p.get('research') or {}
          assert research.get('methodology_version') == '3.0'
          ev=p.get('ev_hunter') or {}
          crowd=p.get('crowd_model') or {}
          integrity=p.get('integrity_audit') or {}
          assert ev.get('model_version') == 'EV Hunter v2.0', ev.get('model_version')
          assert crowd.get('model_version') == 'Crowd Model v1.0', crowd.get('model_version')
          assert integrity.get('model_version') == 'Draw Integrity Auditor v1.0', integrity.get('model_version')
          assert {'Daily Lotto','Lotto','PowerBall'} <= set((ev.get('current') or {}).keys())
          print('Supabase healthy:',counts,'EV',ev.get('model_version'),'Crowd',crowd.get('model_version'),'Integrity',integrity.get('overall_status'))
          PY
      - name: Check scheduled data freshness
        if: github.event_name == 'schedule'
        run: python drawlab-sa/scripts/validate_state.py --max-age-hours 48
