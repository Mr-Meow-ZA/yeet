name: DrawLab Integrity

on:
  pull_request:
    paths:
      - 'drawlab-sa/**'
      - '.github/workflows/drawlab-*.yml'
  push:
    paths:
      - 'drawlab-sa/**'
      - '.github/workflows/drawlab-cloud.yml'
      - '.github/workflows/drawlab-research.yml'
      - '.github/workflows/drawlab-supabase-sync.yml'
      - '.github/workflows/import-drawlab-history.yml'
      - '.github/workflows/drawlab-integrity.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: read

concurrency:
  group: drawlab-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile permanent DrawLab engines
        shell: bash
        run: |
          python -m py_compile \
            drawlab-sa/scripts/update_cloud.py \
            drawlab-sa/scripts/import_history.py \
            drawlab-sa/scripts/research_engine.py \
            drawlab-sa/scripts/strategy_discovery.py \
            drawlab-sa/scripts/shadow_tracker.py \
            drawlab-sa/scripts/ev_hunter.py \
            drawlab-sa/scripts/retrospective_v3.py \
            drawlab-sa/scripts/build_v3_state.py \
            drawlab-sa/scripts/validate_state.py

      - name: Validate stored results and tickets
        run: python drawlab-sa/scripts/validate_state.py

      - name: Validate v3 research artifacts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('drawlab-sa/v3/data')
          for name in ('frozen-alpha.json','retrospective.json','v3-state.json'):
              path=root/name
              assert path.exists() and path.stat().st_size > 2, f'missing {path}'
              json.loads(path.read_text())

          state=json.loads((root/'v3-state.json').read_text())
          assert state.get('schema_version',0) >= 7, state.get('schema_version')
          assert state.get('cloud_status') == 'ok', state.get('cloud_status')
          assert isinstance(state.get('shadow_research'),dict)

          frozen=json.loads((root/'frozen-alpha.json').read_text())
          assert frozen.get('locked') is True and len(frozen.get('lines',{})) == 3

          retro=json.loads((root/'retrospective.json').read_text())
          assert retro.get('simulation',{}).get('method') == 'strict walk-forward; no future leakage'
          assert isinstance(retro.get('summary'),dict) and retro.get('summary')
          assert isinstance(retro.get('payout_quality'),dict)

          research=json.loads(Path('drawlab-sa/data/research-state.json').read_text())
          assert research.get('methodology_version') == '3.0', research.get('methodology_version')
          horizons={str(r.get('horizon')) for r in research.get('walk_forward',[])}
          assert {'1','2','4','8','20','never'} <= horizons, horizons
          assert len(research.get('walk_forward',[])) >= 72
          discovery=research.get('strategy_discovery') or {}
          assert discovery.get('candidate_count',0) >= 20, discovery
          assert {'Daily Lotto','Lotto','PowerBall'} <= set((discovery.get('games') or {}).keys())

          locks=json.loads(Path('drawlab-sa/data/challenger-locks.json').read_text())
          lock_rows=locks.get('locks') or []
          assert any(x.get('id')=='powerball-frequency-reversion-30-v0.1' and x.get('status')=='shadow' for x in lock_rows)
          shadow=json.loads(Path('drawlab-sa/data/shadow-state.json').read_text())
          assert shadow.get('schema_version') == 1 and isinstance(shadow.get('tickets'),list)
          summary=shadow.get('summary') or {}
          assert (summary.get('powerball-frequency-reversion-30-v0.1') or {}).get('status') == 'shadow'

          ev_history=json.loads(Path('drawlab-sa/data/ev-history.json').read_text())
          ev=json.loads(Path('drawlab-sa/data/ev-state.json').read_text())
          coverage=ev_history.get('coverage') or {}
          assert coverage.get('Daily Lotto',0) >= 10, coverage
          assert coverage.get('Lotto',0) >= 5, coverage
          assert coverage.get('PowerBall',0) >= 5, coverage
          assert ev.get('model_version') == 'EV Hunter v1.0', ev.get('model_version')
          assert {'Daily Lotto','Lotto','PowerBall'} <= set((ev.get('current') or {}).keys())
          assert isinstance(ev.get('historical_backtest'),dict)
          assert isinstance(ev.get('shadow_tickets'),list)
          assert (state.get('ev_hunter') or {}).get('model_version') == 'EV Hunter v1.0'
          print('Validated DrawLab v3 state, discovery, shadow research and EV Hunter:',coverage)
          PY

      - name: Validate production website
        shell: bash
        run: |
          set -euo pipefail
          node --check drawlab-sa/v3/app.js
          node --check drawlab-sa/v3/discovery.js
          node --check drawlab-sa/v3/ev.js
          test -s drawlab-sa/index.html
          test -s drawlab-sa/legacy/index.html
          test -s drawlab-sa/v3/styles.css
          test -s drawlab-sa/v3/discovery.js
          test -s drawlab-sa/v3/ev.js
          test -s drawlab-sa/manifest.webmanifest
          test -s drawlab-sa/sw.js
          grep -q 'Research the process' drawlab-sa/index.html
          grep -q '1 · 2 · 4 · 8 · 20 · Never' drawlab-sa/index.html
          grep -q 'id="discoveryCards"' drawlab-sa/index.html
          grep -q 'id="evCards"' drawlab-sa/index.html
          grep -q 'EV Hunter' drawlab-sa/index.html
          grep -q 'drawlab-state' drawlab-sa/v3/app.js
          grep -q 'drawlab-state' drawlab-sa/v3/discovery.js
          grep -q 'drawlab-state' drawlab-sa/v3/ev.js
          grep -q 'strategy_discovery' drawlab-sa/v3/discovery.js
          grep -q 'const rs = db.research' drawlab-sa/v3/app.js
          grep -q 'const dbRetro = db.retrospective' drawlab-sa/v3/app.js
          grep -q 'Frozen Alpha' drawlab-sa/scripts/update_cloud.py
          ! grep -q '__PLACEHOLDER__' drawlab-sa/v3/styles.css

      - name: Verify Supabase read model
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 30 'https://lnmgieielbqqqvboonzj.supabase.co/functions/v1/drawlab-state')"
          python - <<'PY' "$response"
          import json,sys
          p=json.loads(sys.argv[1])
          assert p.get('database_status') == 'ok', p.get('database_status')
          counts=p.get('counts') or {}
          assert counts.get('draws',0) >= 1488, counts
          research=p.get('research') or {}
          assert research.get('methodology_version') == '3.0', research.get('methodology_version')
          hs={str(r.get('horizon')) for r in research.get('walk_forward',[])}
          assert {'1','2','4','8','20','never'} <= hs, hs
          discovery=research.get('strategy_discovery') or {}
          assert discovery.get('candidate_count',0) >= 20, discovery
          assert {'Daily Lotto','Lotto','PowerBall'} <= set((discovery.get('games') or {}).keys())
          shadow=p.get('shadow_research') or {}
          summary=shadow.get('summary') or {}
          assert (summary.get('powerball-frequency-reversion-30-v0.1') or {}).get('status') == 'shadow', summary
          retro=p.get('retrospective') or {}
          assert isinstance(retro.get('summary'),dict) and retro.get('summary'), retro.keys()
          assert isinstance(retro.get('payout_quality'),dict), retro.keys()
          ev=p.get('ev_hunter') or {}
          assert ev.get('model_version') == 'EV Hunter v1.0', ev.get('model_version')
          assert {'Daily Lotto','Lotto','PowerBall'} <= set((ev.get('current') or {}).keys()), ev.keys()
          print('Supabase primary read model is healthy:',counts,'discovery candidates',discovery.get('candidate_count'),'shadow locks',len(summary),'EV',ev.get('model_version'))
          PY

      - name: Check scheduled data freshness
        if: github.event_name == 'schedule'
        run: python drawlab-sa/scripts/validate_state.py --max-age-hours 48
