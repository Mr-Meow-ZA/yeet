name: Patch DrawLab strategy discovery UI

on:
  push:
    paths:
      - '.github/workflows/patch-drawlab-discovery-ui.yml'
      - 'drawlab-sa/scripts/patch_discovery_ui_once.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drawlab-discovery-ui-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply discovery UI patch
        run: python drawlab-sa/scripts/patch_discovery_ui_once.py
      - name: Validate patched website
        shell: bash
        run: |
          set -euo pipefail
          node --check drawlab-sa/v3/app.js
          grep -q 'id="discoveryCards"' drawlab-sa/index.html
          grep -q 'function renderDiscovery' drawlab-sa/v3/app.js
          grep -q 'strategy_discovery: rs.strategy_discovery' drawlab-sa/v3/app.js
          grep -q 'strategy_discovery' drawlab-sa/scripts/build_v3_state.py
          python -m py_compile drawlab-sa/scripts/strategy_discovery.py drawlab-sa/scripts/build_v3_state.py
      - name: Commit patch and remove one-time machinery
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-drawlab-discovery-ui.yml drawlab-sa/scripts/patch_discovery_ui_once.py
          git config user.name 'DrawLab Research Bot'
          git config user.email 'drawlab-research@users.noreply.github.com'
          git add drawlab-sa/index.html drawlab-sa/v3/app.js .github/workflows/drawlab-integrity.yml .github/workflows/patch-drawlab-discovery-ui.yml drawlab-sa/scripts/patch_discovery_ui_once.py
          git commit -m 'Show strategy discovery in DrawLab Research Lab'
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              exit 0
            fi
            git pull --rebase origin master
          done
          exit 1
