name: Install DrawLab terminal UI
on:
  workflow_dispatch:
  push:
    paths:
      - drawlab-sa/scripts/install_terminal_ui.py
      - .github/workflows/install-drawlab-terminal-ui.yml
jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python drawlab-sa/scripts/install_terminal_ui.py
      - name: Commit rebuilt UI
        run: |
          git config user.name "DrawLab UI Bot"
          git config user.email "drawlab-ui-bot@users.noreply.github.com"
          git add drawlab-sa/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild DrawLab as premium analytics terminal"
          git push
