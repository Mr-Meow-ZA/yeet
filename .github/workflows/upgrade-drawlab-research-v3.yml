name: Upgrade DrawLab Research v3

on:
  push:
    paths:
      - '.github/workflows/upgrade-drawlab-research-v3.yml'
      - 'drawlab-sa/scripts/upgrade_research_v3.py'

permissions:
  contents: write

concurrency:
  group: drawlab-data-writes
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch research engine
        run: python drawlab-sa/scripts/upgrade_research_v3.py
      - name: Validate engine
        run: python -m py_compile drawlab-sa/scripts/research_engine.py drawlab-sa/scripts/build_v3_state.py
      - name: Rebuild research state
        run: python drawlab-sa/scripts/research_engine.py
      - name: Rebuild v3 read model
        run: python drawlab-sa/scripts/build_v3_state.py
      - name: Validate v3 research policies
        run: |
          grep -q 'HORIZONS = (1, 2, 4, 8, 20)' drawlab-sa/scripts/research_engine.py
          grep -q '"never" if horizon is None' drawlab-sa/scripts/research_engine.py
          grep -q '"methodology_version": "3.0"' drawlab-sa/scripts/research_engine.py
          python - <<'PY'
          import json
          p=json.load(open('drawlab-sa/data/research-state.json'))
          hs={str(r['horizon']) for r in p['walk_forward']}
          need={'1','2','4','8','20','never'}
          assert need <= hs, (need,hs)
          assert p['methodology_version']=='3.0'
          print('Validated hold policies:', sorted(hs))
          PY
      - name: Commit upgraded research engine and state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DrawLab Research Bot'
          git config user.email 'drawlab-research@users.noreply.github.com'
          git add drawlab-sa/scripts/research_engine.py drawlab-sa/data/research-state.json drawlab-sa/v3/data/v3-state.json
          git commit -m 'Upgrade DrawLab research hold policies to v3'
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            git fetch origin master
            git rebase origin/master
          done
          exit 1
