name: DrawLab Supabase Sync

on:
  workflow_dispatch:
  push:
    paths:
      - 'drawlab-sa/data/cloud-state.json'
      - 'drawlab-sa/data/historical-results.json'
      - 'drawlab-sa/data/research-state.json'
      - 'drawlab-sa/data/shadow-state.json'
      - 'drawlab-sa/data/ev-state.json'
      - 'drawlab-sa/data/challenger-locks.json'
      - 'drawlab-sa/v3/data/retrospective.json'
      - 'drawlab-sa/scripts/sync_supabase.sh'
      - '.github/workflows/drawlab-supabase-sync.yml'

permissions:
  contents: read

concurrency:
  group: drawlab-supabase-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate authenticated sync client
        run: bash -n drawlab-sa/scripts/sync_supabase.sh
      - name: Sync validated repository state to Supabase
        if: github.ref == 'refs/heads/master'
        env:
          DRAWLAB_SYNC_TOKEN: ${{ secrets.DRAWLAB_SYNC_TOKEN }}
        run: bash drawlab-sa/scripts/sync_supabase.sh
