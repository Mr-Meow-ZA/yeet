name: Probe DrawLab EV Sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-drawlab-ev-source.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Probe known result pages
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('drawlab-sa/scripts/ev_hunter.py')
          spec=importlib.util.spec_from_file_location('ev',p)
          ev=importlib.util.module_from_spec(spec); spec.loader.exec_module(ev)
          for game,d in [('Daily Lotto','2026-07-08'),('Lotto','2026-07-01'),('PowerBall','2026-06-30')]:
              url=ev.result_url(game,d)
              try:
                  r=ev.SESSION.get(url,timeout=ev.HTTP_TIMEOUT)
                  print('\n',game,url,'status',r.status_code,'len',len(r.text),'ctype',r.headers.get('content-type'))
                  print('jackpot token', 'Jackpot for this draw' in r.text, 'tickets token', 'Tickets Sold' in r.text, 'sales token', 'Total Sales' in r.text)
                  parsed=ev.parse_economics_page(game,d,r.text,url)
                  print('parsed',parsed and {k:parsed[k] for k in ('jackpot','tickets_sold_reported','total_sales','equivalent_lines')}, 'divs',parsed and list(parsed['divisions']))
                  print('sample',r.text[:300].replace('\n',' '))
              except Exception as exc:
                  print(game,'ERROR',type(exc).__name__,exc)
          PY
