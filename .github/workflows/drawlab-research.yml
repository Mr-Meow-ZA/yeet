name: DrawLab Research Engine

on:
  workflow_dispatch:
  push:
    paths:
      - 'drawlab-sa/scripts/research_engine.py'
      - 'drawlab-sa/scripts/strategy_discovery.py'
      - 'drawlab-sa/scripts/retrospective_v3.py'
      - 'drawlab-sa/scripts/ev_hunter.py'
      - 'drawlab-sa/scripts/build_v3_state.py'
      - 'drawlab-sa/scripts/sync_supabase.sh'
      - 'drawlab-sa/data/historical-results.json'
      - '.github/workflows/drawlab-research.yml'

permissions:
  contents: write

concurrency:
  group: drawlab-data-writes
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Validate research engines
        run: |
          python -m py_compile drawlab-sa/scripts/research_engine.py
          python -m py_compile drawlab-sa/scripts/strategy_discovery.py
          python -m py_compile drawlab-sa/scripts/retrospective_v3.py
          python -m py_compile drawlab-sa/scripts/ev_hunter.py
          python -m py_compile drawlab-sa/scripts/build_v3_state.py
          bash -n drawlab-sa/scripts/sync_supabase.sh
      - name: Run walk-forward research
        run: python drawlab-sa/scripts/research_engine.py
      - name: Search challenger strategy families
        run: python drawlab-sa/scripts/strategy_discovery.py
      - name: Run one-year retrospective
        run: python drawlab-sa/scripts/retrospective_v3.py
      - name: Refresh exact EV economics and selective-entry research
        # The engine reuses a validated cache refreshed within the last six hours.
        run: python drawlab-sa/scripts/ev_hunter.py --refresh-history --workers 1
      - name: Rebuild v3 read model
        run: python drawlab-sa/scripts/build_v3_state.py
      - name: Commit research, EV and v3 state safely
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DrawLab Research Bot'
          git config user.email 'drawlab-research@users.noreply.github.com'

          for attempt in 1 2 3; do
            git add drawlab-sa/data/research-state.json drawlab-sa/data/ev-history.json drawlab-sa/data/ev-state.json drawlab-sa/v3/data/retrospective.json drawlab-sa/v3/data/v3-state.json
            if git diff --cached --quiet; then
              echo 'No research-state changes'
              exit 0
            fi
            git commit -m 'Update DrawLab research, EV and v3 state'
            if git push origin HEAD:master; then
              echo 'Research, EV and v3 state pushed successfully'
              exit 0
            fi
            echo "Push attempt ${attempt} conflicted; rebuilding on current master"
            git fetch origin master
            git reset --hard origin/master
            python drawlab-sa/scripts/research_engine.py
            python drawlab-sa/scripts/strategy_discovery.py
            python drawlab-sa/scripts/retrospective_v3.py
            python drawlab-sa/scripts/ev_hunter.py --refresh-history --workers 1
            python drawlab-sa/scripts/build_v3_state.py
          done
          echo 'Unable to push research state after three attempts'
          exit 1
      - name: Synchronize Supabase primary store
        if: github.ref == 'refs/heads/master'
        env:
          DRAWLAB_SYNC_TOKEN: ${{ secrets.DRAWLAB_SYNC_TOKEN }}
        run: |
          sleep 2
          bash drawlab-sa/scripts/sync_supabase.sh
