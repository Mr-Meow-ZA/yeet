name: Add DrawLab match inspector
on:
  push:
    paths:
      - '.github/workflows/add-match-inspector.yml'
      - 'drawlab-sa/scripts/add_match_inspector.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch app
        run: python drawlab-sa/scripts/add_match_inspector.py
      - name: Validate embedded JavaScript markers
        run: |
          grep -q 'MATCH_INSPECTOR_V1' drawlab-sa/index.html
          grep -q 'View matched numbers' drawlab-sa/index.html
      - name: Commit app update
        run: |
          git config user.name 'DrawLab UI Bot'
          git config user.email 'drawlab-ui@users.noreply.github.com'
          git add drawlab-sa/index.html
          git diff --cached --quiet || git commit -m 'Add clickable match breakdowns'
          git push
