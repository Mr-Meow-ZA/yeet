name: Patch DrawLab retrospective primary read

on:
  push:
    paths:
      - '.github/workflows/patch-drawlab-retro-primary.yml'

permissions:
  contents: write

concurrency:
  group: drawlab-retro-primary-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch retrospective adapter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('drawlab-sa/v3/app.js')
          s=p.read_text()
          old="    out.retrospective = dbRetroToLocal(db.retrospective,out.retrospective);"
          new="""    const dbRetro = db.retrospective;
              out.retrospective = dbRetro && !Array.isArray(dbRetro) && typeof dbRetro === 'object'
                ? {...(out.retrospective||{}), ...dbRetro}
                : dbRetroToLocal(dbRetro,out.retrospective);"""
          if old not in s:
              raise SystemExit('expected retrospective adapter not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check drawlab-sa/v3/app.js
          grep -q "const dbRetro = db.retrospective" drawlab-sa/v3/app.js
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-drawlab-retro-primary.yml
          git config user.name 'DrawLab v3 Builder'
          git config user.email 'drawlab-v3@users.noreply.github.com'
          git add drawlab-sa/v3/app.js .github/workflows/patch-drawlab-retro-primary.yml
          git commit -m 'Use Supabase retrospective as primary DrawLab read model'
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            git fetch origin master
            git rebase origin/master
          done
          exit 1
