name: DrawLab Cloud Tracker

on:
  push:
    paths:
      - 'drawlab-sa/scripts/update_cloud.py'
      - 'drawlab-sa/scripts/import_history.py'
      - '.github/workflows/drawlab-cloud.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
      timezone: 'Africa/Johannesburg'
    - cron: '20 22 * * *'
      timezone: 'Africa/Johannesburg'

permissions:
  contents: write

concurrency:
  group: drawlab-cloud
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Update virtual ledger and results
        run: python drawlab-sa/scripts/update_cloud.py
      - name: Commit cloud state safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DrawLab Cloud Bot'
          git config user.email 'drawlab-bot@users.noreply.github.com'

          for attempt in 1 2 3; do
            git add drawlab-sa/data/cloud-state.json
            if git diff --cached --quiet; then
              echo 'No state changes'
              exit 0
            fi

            git commit -m 'Update DrawLab cloud state'
            if git push origin HEAD:master; then
              echo 'Cloud state pushed successfully'
              exit 0
            fi

            echo "Push attempt ${attempt} failed because master changed. Refreshing and rebuilding from latest state..."
            git fetch origin master
            git reset --hard origin/master
            python drawlab-sa/scripts/update_cloud.py
          done

          echo 'Unable to push cloud state after 3 attempts'
          exit 1
