name: DrawLab Cloud Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
      timezone: 'Africa/Johannesburg'
    - cron: '20 22 * * *'
      timezone: 'Africa/Johannesburg'
  push:
    paths:
      - 'drawlab-sa/scripts/update_cloud.py'
      - 'drawlab-sa/scripts/shadow_tracker.py'
      - 'drawlab-sa/scripts/ev_hunter.py'
      - 'drawlab-sa/scripts/build_v3_state.py'
      - 'drawlab-sa/data/challenger-locks.json'
      - 'drawlab-sa/data/ev-history.json'
      - 'drawlab-sa/v3/data/frozen-alpha.json'
      - 'drawlab-sa/data/historical-results.json'
      - '.github/workflows/drawlab-cloud.yml'

permissions:
  contents: write

concurrency:
  group: drawlab-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Validate cloud and v3 engines
        run: |
          python -m py_compile drawlab-sa/scripts/update_cloud.py
          python -m py_compile drawlab-sa/scripts/shadow_tracker.py
          python -m py_compile drawlab-sa/scripts/ev_hunter.py
          python -m py_compile drawlab-sa/scripts/build_v3_state.py
      - name: Update virtual ledger and results
        run: python drawlab-sa/scripts/update_cloud.py
      - name: Update prospective challenger shadow ledger
        run: python drawlab-sa/scripts/shadow_tracker.py
      - name: Update selective EV research
        run: python drawlab-sa/scripts/ev_hunter.py
      - name: Rebuild v3 read model
        run: python drawlab-sa/scripts/build_v3_state.py
      - name: Commit cloud, shadow, EV and v3 state safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DrawLab Cloud Bot'
          git config user.email 'drawlab-bot@users.noreply.github.com'

          for attempt in 1 2 3; do
            git add drawlab-sa/data/cloud-state.json drawlab-sa/data/shadow-state.json drawlab-sa/data/ev-state.json drawlab-sa/v3/data/v3-state.json
            if git diff --cached --quiet; then
              echo 'No cloud/shadow/EV/v3 state changes'
              exit 0
            fi

            git commit -m 'Update DrawLab cloud, shadow, EV and v3 state'
            if git push origin HEAD:master; then
              echo 'Cloud, shadow, EV and v3 state pushed successfully'
              exit 0
            fi

            echo "Push attempt ${attempt} conflicted with another data writer; rebuilding from current master"
            git fetch origin master
            git reset --hard origin/master
            python drawlab-sa/scripts/update_cloud.py
            python drawlab-sa/scripts/shadow_tracker.py
            python drawlab-sa/scripts/ev_hunter.py
            python drawlab-sa/scripts/build_v3_state.py
          done

          echo 'Unable to push cloud state after three attempts'
          exit 1
      - name: Synchronize Supabase primary store
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          response="$(curl --fail-with-body --silent --show-error --max-time 90 'https://lnmgieielbqqqvboonzj.supabase.co/functions/v1/drawlab-sync')"
          echo "$response"
          python - <<'PY' "$response"
          import json,sys
          p=json.loads(sys.argv[1])
          assert p.get('ok'), p
          sync=p.get('sync') or {}
          assert sync.get('research_synced'), p
          assert sync.get('ev_synced'), p
          print('Supabase synchronized after cloud update')
          PY
