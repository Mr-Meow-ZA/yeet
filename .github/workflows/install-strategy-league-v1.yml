name: Install deterministic strategy league v1
on:
  push:
    paths:
      - '.github/workflows/install-strategy-league-v1.yml'
      - 'drawlab-sa/scripts/install_strategy_league_v1.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic strategy engine
        run: python drawlab-sa/scripts/install_strategy_league_v1.py
      - name: Validate Python syntax
        run: python -m py_compile drawlab-sa/scripts/update_cloud.py
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Refresh cloud state
        run: python drawlab-sa/scripts/update_cloud.py
      - name: Commit strategy engine and refreshed state
        run: |
          git config user.name 'DrawLab Cloud Bot'
          git config user.email 'drawlab-bot@users.noreply.github.com'
          git add drawlab-sa/scripts/update_cloud.py drawlab-sa/data/cloud-state.json
          git diff --cached --quiet || git commit -m 'Install deterministic four-strategy league v1.0'
          git pull --rebase origin master
          git push origin master
