name: Import DrawLab history

on:
  workflow_dispatch:
  schedule:
    - cron: '35 20 * * 0'
  push:
    paths:
      - 'drawlab-sa/scripts/install_history_importer.py'
      - '.github/workflows/import-drawlab-history.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install importer
        run: python drawlab-sa/scripts/install_history_importer.py
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Validate scripts
        run: |
          python -m py_compile drawlab-sa/scripts/import_history.py
          python -m py_compile drawlab-sa/scripts/update_cloud.py
      - name: Import current-format history
        run: python drawlab-sa/scripts/import_history.py --start-year 2024 --end-year 2026
      - name: Refresh live cloud state
        run: python drawlab-sa/scripts/update_cloud.py
      - name: Commit imported history
        run: |
          git config user.name 'DrawLab History Bot'
          git config user.email 'drawlab-history@users.noreply.github.com'
          git add drawlab-sa/scripts/import_history.py drawlab-sa/scripts/update_cloud.py drawlab-sa/data/historical-results.json drawlab-sa/data/cloud-state.json
          git diff --cached --quiet || git commit -m 'Import verified DrawLab historical results'
          git pull --rebase origin master
          git push
