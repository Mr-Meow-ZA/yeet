name: Import DrawLab history

on:
  workflow_dispatch:
  schedule:
    - cron: '35 20 * * 0'
  push:
    paths:
      - 'drawlab-sa/scripts/import_history.py'
      - '.github/workflows/import-drawlab-history.yml'

permissions:
  contents: write

concurrency:
  group: drawlab-data-writes
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Resolve archive window
        shell: bash
        run: |
          set -euo pipefail
          echo "DRAWLAB_END_YEAR=$(date -u +%Y)" >> "$GITHUB_ENV"
          echo "DrawLab archive window: 2024 through $(date -u +%Y)"
      - name: Validate DrawLab engines
        run: |
          python -m py_compile drawlab-sa/scripts/import_history.py
          python -m py_compile drawlab-sa/scripts/research_engine.py
          python -m py_compile drawlab-sa/scripts/retrospective_v3.py
          python -m py_compile drawlab-sa/scripts/update_cloud.py
          python -m py_compile drawlab-sa/scripts/build_v3_state.py
          python -m py_compile drawlab-sa/scripts/validate_state.py
      - name: Import and validate history
        run: python drawlab-sa/scripts/import_history.py --start-year 2024 --end-year "$DRAWLAB_END_YEAR"
      - name: Rebuild walk-forward research
        run: python drawlab-sa/scripts/research_engine.py
      - name: Rebuild one-year retrospective
        run: python drawlab-sa/scripts/retrospective_v3.py
      - name: Refresh live cloud state
        run: python drawlab-sa/scripts/update_cloud.py
      - name: Rebuild v3 read model
        run: python drawlab-sa/scripts/build_v3_state.py
      - name: Validate resulting state
        run: python drawlab-sa/scripts/validate_state.py
      - name: Commit validated data safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DrawLab History Bot'
          git config user.email 'drawlab-history@users.noreply.github.com'

          for attempt in 1 2 3; do
            git add drawlab-sa/data/historical-results.json drawlab-sa/data/research-state.json drawlab-sa/data/cloud-state.json drawlab-sa/v3/data/retrospective.json drawlab-sa/v3/data/v3-state.json
            if git diff --cached --quiet; then
              echo 'No validated data changes'
              break
            fi

            git commit -m 'Refresh validated DrawLab history and v3 research'
            if git push origin HEAD:master; then
              echo 'DrawLab historical and v3 research data pushed successfully'
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo 'Unable to push validated DrawLab data after three attempts'
              exit 1
            fi

            echo "Push attempt ${attempt} conflicted with another data writer; rebuilding from current master"
            git fetch origin master
            git reset --hard origin/master
            python drawlab-sa/scripts/import_history.py --start-year 2024 --end-year "$DRAWLAB_END_YEAR"
            python drawlab-sa/scripts/research_engine.py
            python drawlab-sa/scripts/retrospective_v3.py
            python drawlab-sa/scripts/update_cloud.py
            python drawlab-sa/scripts/build_v3_state.py
            python drawlab-sa/scripts/validate_state.py
          done
      - name: Synchronize Supabase primary store
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          response="$(curl --fail-with-body --silent --show-error --max-time 90 'https://lnmgieielbqqqvboonzj.supabase.co/functions/v1/drawlab-sync')"
          echo "$response"
          python - <<'PY' "$response"
          import json,sys
          p=json.loads(sys.argv[1])
          assert p.get('ok'), p
          assert (p.get('sync') or {}).get('research_synced'), p
          print('Supabase synchronized after history refresh')
          PY
